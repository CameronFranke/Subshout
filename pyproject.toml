[project]
name = "shout-daemon"
version = "0.1.0"
description = "Shout ASR daemon: parakeet-mlx behind a Unix socket, driven by the Shout macOS app."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "parakeet-mlx>=0.5.1",
    "soundfile>=0.13.1",  # only for tests / CLI smoke; daemon receives PCM over IPC
]

[project.scripts]
shout-daemon = "shout_daemon.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["shout_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the Parakeet model weights (slow / network / GPU)",
]
